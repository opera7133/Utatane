<svg xmlns="http://www.w3.org/2000/svg" width="768" height="512" viewBox="0 0 768 512" role="img" aria-labelledby="title description">
  <title id="title">Utatane DMG background</title>
  <desc id="description">Light paper-like curves and one right-pointing arrow. Finder supplies the app and Applications icons.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fffefa"/>
      <stop offset="0.62" stop-color="#fdfdfb"/>
      <stop offset="1" stop-color="#f7faf9"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e9f3f3"/>
      <stop offset="1" stop-color="#d4e9ec"/>
    </linearGradient>
    <linearGradient id="far-wave" x1="0" y1="0" x2="0.9" y2="1">
      <stop stop-color="#e4f0f1"/>
      <stop offset="1" stop-color="#f1f7f6"/>
    </linearGradient>
    <linearGradient id="near-wave" x1="0" y1="0" x2="1" y2="0.5">
      <stop stop-color="#c4e0e6"/>
      <stop offset="0.6" stop-color="#e0eef0"/>
      <stop offset="1" stop-color="#d2e8eb"/>
    </linearGradient>
  </defs>

  <rect id="base" width="768" height="512" fill="url(#paper)"/>

  <g id="corner-folds">
    <path d="M0 0H105C79 36 42 66 0 91Z" fill="url(#fold)" opacity="0.5"/>
    <path d="M471 0H768V153C698 130 669 99 616 79C551 55 503 51 471 0Z" fill="url(#fold)" opacity="0.72"/>
    <path d="M613 0H768V153C719 124 695 104 675 77C652 46 642 24 613 0Z" fill="#c9e3e8" opacity="0.42"/>
  </g>

  <g id="bottom-waves">
    <path d="M0 350C108 318 172 364 250 405C339 453 432 483 525 474C617 465 675 377 768 359V512H0Z" fill="url(#far-wave)"/>
    <path d="M0 379C93 349 144 431 230 431C321 431 340 403 422 438C520 479 581 504 650 478C696 460 733 443 768 441V512H0Z" fill="url(#near-wave)"/>
    <path d="M0 464C91 428 141 447 220 478C316 515 405 491 491 481C580 471 642 467 768 431V512H0Z" fill="#edf5f5" opacity="0.9"/>
  </g>

  <text id="wordmark" x="64" y="107" fill="#282e37" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" letter-spacing="1">Utatane</text>

  <g id="install-arrow" fill="none" stroke="#4096a8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M334 256H434"/>
    <path d="M416 239L434 256L416 273"/>
  </g>
</svg>
