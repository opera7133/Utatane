name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install xcodegen zig

      - name: Test
        run: swift test --package-path packages

      - name: Build Materia SHIORI host
        run: |
          mkdir -p apps/Utatane/Resources/MateriaHost
          zig cc \
            -target x86-windows-gnu \
            -Os \
            tools/materia-shiori-host/main.c \
            -o apps/Utatane/Resources/MateriaHost/materia.exe
          mkdir -p apps/Utatane/Resources/WindowsDLLHost
          zig cc \
            -target x86-windows-gnu \
            -Os \
            tools/windows-dll-host/main.c \
            -o apps/Utatane/Resources/WindowsDLLHost/utatane-dll-host.exe

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build universal app
        run: |
          xcodebuild \
            -project Utatane.xcodeproj \
            -scheme Utatane \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build universal MCP server
        run: |
          swift build \
            --package-path packages \
            --configuration release \
            --arch arm64 \
            --arch x86_64 \
            --product utatane-mcp

      - name: Verify Materia SHIORI host
        run: |
          test -f build/Build/Products/Release/Utatane.app/Contents/Resources/materia.exe
          file build/Build/Products/Release/Utatane.app/Contents/Resources/materia.exe \
            | grep -q "PE32 executable"
          test -f build/Build/Products/Release/Utatane.app/Contents/Resources/utatane-dll-host.exe
          file build/Build/Products/Release/Utatane.app/Contents/Resources/utatane-dll-host.exe \
            | grep -q "PE32 executable"

      - name: Embed MCP server
        run: |
          mkdir -p build/Build/Products/Release/Utatane.app/Contents/Helpers
          cp \
            packages/.build/apple/Products/Release/utatane-mcp \
            build/Build/Products/Release/Utatane.app/Contents/Helpers/utatane-mcp
          chmod 755 build/Build/Products/Release/Utatane.app/Contents/Helpers/utatane-mcp
          lipo \
            build/Build/Products/Release/Utatane.app/Contents/Helpers/utatane-mcp \
            -verify_arch arm64 x86_64

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent \
            build/Build/Products/Release/Utatane.app \
            dist/Utatane-macOS.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Utatane-macOS
          path: dist/Utatane-macOS.zip
          retention-days: 14

      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Utatane-macOS.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/Utatane-macOS.zip \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --prerelease
          fi
