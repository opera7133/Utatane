name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install lftp xcodegen zig

      - name: Prepare version
        shell: bash
        run: |
          version="0.1.0"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "UTATANE_VERSION=$version" >> "$GITHUB_ENV"
          echo "UTATANE_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Test
        run: swift test --package-path packages

      - name: Build Materia SHIORI host
        run: |
          mkdir -p apps/Utatane/Resources/MateriaHost
          zig cc \
            -target x86-windows-gnu \
            -Os \
            tools/materia-shiori-host/main.c \
            -o apps/Utatane/Resources/MateriaHost/materia.exe
          mkdir -p apps/Utatane/Resources/WindowsDLLHost
          zig cc \
            -target x86-windows-gnu \
            -Os \
            tools/windows-dll-host/main.c \
            -o apps/Utatane/Resources/WindowsDLLHost/utatane-dll-host.exe

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build universal app
        run: |
          xcodebuild \
            -project Utatane.xcodeproj \
            -scheme Utatane \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$UTATANE_VERSION" \
            CURRENT_PROJECT_VERSION="$UTATANE_BUILD_NUMBER" \
            build

      - name: Build universal MCP server
        run: |
          swift build \
            --package-path packages \
            --configuration release \
            --arch arm64 \
            --arch x86_64 \
            --product utatane-mcp

      - name: Verify Materia SHIORI host
        run: |
          test -f build/Build/Products/Release/Utatane.app/Contents/Resources/materia.exe
          file build/Build/Products/Release/Utatane.app/Contents/Resources/materia.exe \
            | grep -q "PE32 executable"
          test -f build/Build/Products/Release/Utatane.app/Contents/Resources/utatane-dll-host.exe
          file build/Build/Products/Release/Utatane.app/Contents/Resources/utatane-dll-host.exe \
            | grep -q "PE32 executable"

      - name: Embed MCP server
        run: |
          mkdir -p build/Build/Products/Release/Utatane.app/Contents/Helpers
          cp \
            packages/.build/apple/Products/Release/utatane-mcp \
            build/Build/Products/Release/Utatane.app/Contents/Helpers/utatane-mcp
          chmod 755 build/Build/Products/Release/Utatane.app/Contents/Helpers/utatane-mcp
          lipo \
            build/Build/Products/Release/Utatane.app/Contents/Helpers/utatane-mcp \
            -verify_arch arm64 x86_64

      - name: Package
        run: |
          mkdir -p dist
          codesign --force --sign - --identifier dev.utatane.mcp \
            build/Build/Products/Release/Utatane.app/Contents/Helpers/utatane-mcp
          codesign --force --deep --sign - --identifier dev.utatane.app \
            build/Build/Products/Release/Utatane.app
          codesign --verify --deep --strict \
            build/Build/Products/Release/Utatane.app
          ditto -c -k --keepParent \
            build/Build/Products/Release/Utatane.app \
            dist/Utatane-macOS.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Utatane-macOS
          path: dist/Utatane-macOS.zip
          retention-days: 14

      - name: Generate signed appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          generator=build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast
          test -x "$generator"
          mkdir -p dist/update-feed
          cp dist/Utatane-macOS.zip dist/update-feed/Utatane-macOS.zip
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$generator" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/opera7133/Utatane/releases/download/$GITHUB_REF_NAME/" \
            --link "https://dl.wmsci.com/utatane.html" \
            --maximum-deltas 0 \
            -o dist/update-feed/appcast.xml \
            dist/update-feed

      - name: Upload update feed artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Utatane-update-feed
          path: dist/update-feed/appcast.xml
          retention-days: 14

      - name: Prepare bundled content updates
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p dist/content/ria dist/content/balloon-ria
          rsync -a \
            --exclude '.DS_Store' \
            --exclude '*_variable.cfg' \
            Content/Bundled/Ghosts/ria/ \
            dist/content/ria/
          rsync -a \
            --exclude '.DS_Store' \
            --exclude '*_variable.cfg' \
            Content/Bundled/Balloons/ria/ \
            dist/content/balloon-ria/
          bash Scripts/generate-content-manifest.sh \
            dist/content/ria \
            dist/content/ria/updates2.dau
          bash Scripts/generate-content-manifest.sh \
            dist/content/balloon-ria \
            dist/content/balloon-ria/updates2.dau

      - name: Upload content update artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Utatane-bundled-content-updates
          path: dist/content
          retention-days: 14

      - name: Scan with VirusTotal
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          file_path="dist/Utatane-macOS.zip"
          if [ ! -f "$file_path" ]; then
            echo "Error: $file_path not found"
            exit 1
          fi

          sha256=$(shasum -a 256 "$file_path" | awk '{print $1}')
          vt_url="https://www.virustotal.com/gui/file/$sha256"
          file_size=$(stat -f%z "$file_path" 2>/dev/null || stat -c%s "$file_path" 2>/dev/null || wc -c < "$file_path" | tr -d ' ')

          echo "SHA-256: $sha256"
          echo "File size: $file_size bytes"
          echo "VT URL: $vt_url"

          vt_status="Not scanned (VIRUSTOTAL_API_KEY not configured)"

          if [ -n "$VT_API_KEY" ]; then
            echo "VIRUSTOTAL_API_KEY is present. Requesting VirusTotal scan..."

            # 32MB = 33554432 bytes
            upload_target="https://www.virustotal.com/api/v3/files"
            if [ "$file_size" -gt 33554432 ]; then
              echo "File size exceeds 32MB. Fetching large file upload URL..."
              upload_url_response=$(curl -s --request GET \
                --url "https://www.virustotal.com/api/v3/files/upload_url" \
                --header "x-apikey: $VT_API_KEY")
              upload_target=$(echo "$upload_url_response" | jq -r '.data // empty')
              if [ -z "$upload_target" ]; then
                echo "Failed to get upload URL: $upload_url_response"
                upload_target="https://www.virustotal.com/api/v3/files"
              fi
            fi

            echo "Uploading file to VirusTotal..."
            upload_res=$(curl -s --request POST \
              --url "$upload_target" \
              --header "x-apikey: $VT_API_KEY" \
              --form "file=@$file_path")

            analysis_id=$(echo "$upload_res" | jq -r '.data.id // empty')

            if [ -n "$analysis_id" ]; then
              echo "Analysis ID: $analysis_id"
              echo "Waiting for scan completion (up to 60s)..."

              completed=false
              for i in {1..12}; do
                sleep 5
                analysis_res=$(curl -s --request GET \
                  --url "https://www.virustotal.com/api/v3/analyses/$analysis_id" \
                  --header "x-apikey: $VT_API_KEY")

                status=$(echo "$analysis_res" | jq -r '.data.attributes.status // empty')
                echo "Check $i: status = $status"

                if [ "$status" = "completed" ]; then
                  completed=true
                  malicious=$(echo "$analysis_res" | jq -r '.data.attributes.stats.malicious // 0')
                  suspicious=$(echo "$analysis_res" | jq -r '.data.attributes.stats.suspicious // 0')
                  undetected=$(echo "$analysis_res" | jq -r '.data.attributes.stats.undetected // 0')
                  harmless=$(echo "$analysis_res" | jq -r '.data.attributes.stats.harmless // 0')
                  total=$((malicious + suspicious + undetected + harmless))

                  if [ "$malicious" -eq 0 ] && [ "$suspicious" -eq 0 ]; then
                    vt_status="✅ Clean ($malicious / $total security vendors flagged as malicious)"
                  else
                    vt_status="⚠️ Flagged ($malicious / $total security vendors flagged as malicious)"
                  fi
                  break
                fi
              done

              if [ "$completed" = false ]; then
                vt_status="⏳ Scan queued / in progress (check report link)"
              fi
            else
              echo "Upload failed or returned unexpected response: $upload_res"
              vt_status="⚠️ Upload failed (check report link)"
            fi
          else
            echo "VIRUSTOTAL_API_KEY secret not found. Skipping API upload."
          fi

          echo "VT_SHA256=$sha256" >> "$GITHUB_ENV"
          echo "VT_URL=$vt_url" >> "$GITHUB_ENV"
          echo "VT_STATUS=$vt_status" >> "$GITHUB_ENV"

          {
            echo "### 🛡️ VirusTotal Scan Results"
            echo "- **File:** \`Utatane-macOS.zip\`"
            echo "- **Status:** $vt_status"
            echo "- **SHA-256:** \`$sha256\`"
            echo "- **Report:** [$vt_url]($vt_url)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/Utatane-macOS.zip \
              dist/update-feed/appcast.xml \
              --clobber

            existing_body=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
            clean_body=$(printf '%s\n' "$existing_body" | sed '/### 🛡️ VirusTotal Scan/,$d' | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba')
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/Utatane-macOS.zip \
              dist/update-feed/appcast.xml \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --prerelease

            existing_body=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
            clean_body=$(printf '%s\n' "$existing_body" | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba')
          fi

          {
            if [ -n "$clean_body" ]; then
              printf '%s\n\n' "$clean_body"
            fi
            echo "### 🛡️ VirusTotal Scan"
            echo "- **Status:** $VT_STATUS"
            echo "- **SHA-256:** \`$VT_SHA256\`"
            echo "- **Report:** $VT_URL"
          } > release_notes.md

          gh release edit "$GITHUB_REF_NAME" --notes-file release_notes.md

      - name: Publish updates to dl.wmsci.com
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USERNAME"
          test -n "$DEPLOY_PASSWORD"
          test -n "$DEPLOY_PATH"
          [[ "$DEPLOY_PATH" == /* ]]
          lftp -u "$DEPLOY_USERNAME","$DEPLOY_PASSWORD" "ftp://$DEPLOY_HOST" <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 3
          set net:timeout 20
          mirror --reverse --ignore-time --parallel=4 \
            --exclude-glob updates2.dau \
            dist/content/ria "$DEPLOY_PATH/content/ria"
          mirror --reverse --ignore-time --parallel=4 \
            --exclude-glob updates2.dau \
            dist/content/balloon-ria "$DEPLOY_PATH/content/balloon-ria"
          put -O "$DEPLOY_PATH/content/ria" dist/content/ria/updates2.dau
          put -O "$DEPLOY_PATH/content/balloon-ria" dist/content/balloon-ria/updates2.dau
          put -O "$DEPLOY_PATH" dist/update-feed/appcast.xml
          bye
          LFTP
