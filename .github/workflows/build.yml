name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "Docs/**"
      - "Internal-Docs/**"
      - "References/**"
      - "website/**"
      - "Scripts/test-website.cjs"
      - ".vscode/**"
  pull_request:
    paths-ignore:
      - "**/README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "Docs/**"
      - "Internal-Docs/**"
      - "References/**"
      - "website/**"
      - "Scripts/test-website.cjs"
      - ".vscode/**"
  workflow_dispatch:
    inputs:
      check_signing:
        description: 'Only validate signing secrets on a fresh runner; do not build or publish a release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.check_signing && 'signing-check' || 'normal' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || !inputs.check_signing
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Test release note generation
        run: python3 Scripts/test-release-notes.py

      - name: Test delayed notarization and publication guards
        run: |
          python3 Scripts/test-release-notarization.py
          python3 Scripts/test-publish-existing-notarized.py

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.5'
          python-version: '3.13'

      - name: Test real DMG generation, Finder layout, and signature preservation
        run: |
          brew install librsvg
          uv run --no-config --project Scripts/dmg --locked python Scripts/test-dmg.py

      - name: Test Swift packages
        run: swift test --package-path packages

  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.check_signing
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Xcode project generator
        run: brew install xcodegen

      - name: Install Windows host build tool
        if: startsWith(github.ref, 'refs/tags/v')
        run: brew install zig

      - name: Prepare version
        shell: bash
        run: |
          version=$(awk '$1 == "MARKETING_VERSION:" { print $2; exit }' project.yml)
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "UTATANE_VERSION=$version" >> "$GITHUB_ENV"
          echo "UTATANE_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build debug app
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          xcodebuild \
            -project Utatane.xcodeproj \
            -scheme Utatane \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$UTATANE_VERSION" \
            CURRENT_PROJECT_VERSION="$UTATANE_BUILD_NUMBER" \
            -showBuildTimingSummary \
            build

      - name: Build universal app
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          xcodebuild \
            -project Utatane.xcodeproj \
            -scheme Utatane \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$UTATANE_VERSION" \
            CURRENT_PROJECT_VERSION="$UTATANE_BUILD_NUMBER" \
            -showBuildTimingSummary \
            build

      - name: Verify native SHIORI host
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          host=build/Build/Products/Release/Utatane.app/Contents/Helpers/utatane-shiori-host
          test -x "$host"
          lipo "$host" -verify_arch arm64 x86_64
          codesign --verify --strict "$host"

      - name: Build Windows DLL host
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          Scripts/build-windows-dll-host.sh \
            build/Build/Products/Release/Utatane.app/Contents/Resources/utatane-dll-host.exe

      - name: Build universal MCP server
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          swift build \
            --package-path packages \
            --configuration release \
            --arch arm64 \
            --arch x86_64 \
            --product utatane-mcp

      - name: Verify Windows DLL host
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          host=build/Build/Products/Release/Utatane.app/Contents/Resources/utatane-dll-host.exe
          comparison_host="$RUNNER_TEMP/utatane-dll-host.exe"
          test -f "$host"
          file "$host" \
            | grep -q "PE32 executable"
          test "$(stat -f%z "$host")" -lt 16384
          ! strings "$host" | grep -q "api-ms-win-crt"
          Scripts/build-windows-dll-host.sh "$comparison_host"
          cmp "$host" "$comparison_host"

      - name: Embed MCP server
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p build/Build/Products/Release/Utatane.app/Contents/Helpers
          cp \
            packages/.build/apple/Products/Release/utatane-mcp \
            build/Build/Products/Release/Utatane.app/Contents/Helpers/utatane-mcp
          chmod 755 build/Build/Products/Release/Utatane.app/Contents/Helpers/utatane-mcp
          lipo \
            build/Build/Products/Release/Utatane.app/Contents/Helpers/utatane-mcp \
            -verify_arch arm64 x86_64

      - name: Prepare release build inputs
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist/release-inputs
          ditto -c -k --keepParent \
            build/Build/Products/Release/Utatane.app \
            dist/release-inputs/Utatane-unsigned.zip
          install -m 755 \
            build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
            dist/release-inputs/generate_appcast

      - name: Upload release build inputs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: Utatane-release-build-inputs
          path: dist/release-inputs
          retention-days: 7

  nicxlive:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install nicxlive build tools
        run: brew install cmake boost

      - name: Read pinned nicxlive version
        id: nicxlive-version
        shell: bash
        run: |
          source Scripts/nicxlive-runtime-version.env
          echo "commit=$NICXLIVE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned nicxlive source
        uses: actions/checkout@v7
        with:
          repository: nijigenerate/nicxlive
          ref: ${{ steps.nicxlive-version.outputs.commit }}
          path: build/nicxlive

      - name: Build universal nicxlive runtime
        run: |
          Scripts/build-nicxlive-runtime.sh \
            build/nicxlive \
            build/nicxlive-universal \
            build/nicxlive-runtime

      - name: Upload nicxlive runtime
        uses: actions/upload-artifact@v7
        with:
          name: Utatane-nicxlive-runtime
          path: build/nicxlive-runtime
          retention-days: 7

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, nicxlive]
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release build inputs
        uses: actions/download-artifact@v8
        with:
          name: Utatane-release-build-inputs
          path: dist/release-inputs

      - name: Download nicxlive runtime
        uses: actions/download-artifact@v8
        with:
          name: Utatane-nicxlive-runtime
          path: build/nicxlive-runtime

      - name: Assemble app
        run: |
          mkdir -p build/Build/Products/Release dist
          ditto -x -k \
            dist/release-inputs/Utatane-unsigned.zip \
            build/Build/Products/Release
          TARGET_BUILD_DIR="$GITHUB_WORKSPACE/build/Build/Products/Release" \
            FRAMEWORKS_FOLDER_PATH="Utatane.app/Contents/Frameworks" \
            UNLOCALIZED_RESOURCES_FOLDER_PATH="Utatane.app/Contents/Resources" \
            UTATANE_NICXLIVE_RUNTIME_LIBRARY="$GITHUB_WORKSPACE/build/nicxlive-runtime/libnicxlive.dylib" \
            UTATANE_NICXLIVE_RUNTIME_LICENSE="$GITHUB_WORKSPACE/build/nicxlive-runtime/LICENSE" \
            Scripts/embed-nicxlive-runtime.sh
      - name: Prepare bundled content updates
        shell: bash
        run: |
          mkdir -p dist/content/ria dist/content/balloon-ria
          rsync -a \
            --exclude '.DS_Store' \
            --exclude '*_variable.cfg' \
            --exclude 'Utatane-YAYA-backup' \
            Content/Bundled/Ghosts/ria/ \
            dist/content/ria/
          rsync -a \
            --exclude '.DS_Store' \
            --exclude '*_variable.cfg' \
            --exclude 'Utatane-YAYA-backup' \
            Content/Bundled/Balloons/ria/ \
            dist/content/balloon-ria/
          bash Scripts/generate-content-manifest.sh \
            dist/content/ria \
            dist/content/ria/updates2.dau
          bash Scripts/generate-content-manifest.sh \
            dist/content/balloon-ria \
            dist/content/balloon-ria/updates2.dau

      - name: Import Developer ID and notarization credentials
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash Scripts/setup-apple-signing.sh

      - name: Sign the complete app
        run: python3 Scripts/sign-app.py build/Build/Products/Release/Utatane.app --identity "$UTATANE_SIGN_IDENTITY"

      - name: Export Retina DMG artwork from SVG
        run: |
          brew install librsvg
          python3 Scripts/export-dmg-assets.py

      - name: Preserve the exact signed candidate
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 Scripts/release-notarization.py prepare \
            --app build/Build/Products/Release/Utatane.app \
            --generator dist/release-inputs/generate_appcast --content dist/content \
            --dmg-assets build/dmg-assets

      - name: Upload signed candidate for delayed notarization
        uses: actions/upload-artifact@v7
        with:
          name: Utatane-notary-candidate
          path: dist/notary-candidate
          retention-days: 30
          if-no-files-found: error

      - name: Remove temporary signing material
        if: always()
        run: |
          if [[ -n "${UTATANE_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$UTATANE_SIGNING_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/utatane-developer-id.p12"

  signing-check:
    if: github.event_name == 'workflow_dispatch' && inputs.check_signing
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Import and validate the configured credentials
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash Scripts/setup-apple-signing.sh
      - name: Sign and execute an isolated test program
        run: |
          xcrun clang -x c -o "$RUNNER_TEMP/utatane-signing-check" - <<'C'
          int main(void) { return 0; }
          C
          codesign --force --sign "$UTATANE_SIGN_IDENTITY" --timestamp --options runtime \
            --identifier dev.utatane.signing-check "$RUNNER_TEMP/utatane-signing-check"
          codesign --verify --strict "$RUNNER_TEMP/utatane-signing-check"
          "$RUNNER_TEMP/utatane-signing-check"
          echo 'Developer ID signing and notarization authentication succeeded. No release or notarization was submitted.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing material
        if: always()
        run: |
          if [[ -n "${UTATANE_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$UTATANE_SIGNING_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/utatane-developer-id.p12"

  notarize:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: Utatane-notary-candidate
          path: dist/notary-candidate
      - name: Configure notarization credentials
        env:
          UTATANE_NOTARY_ONLY: '1'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash Scripts/setup-apple-signing.sh
      - name: Submit once without holding a runner for Apple's processing
        id: submit
        run: python3 Scripts/release-notarization.py submit
      - name: Preserve notarization request
        if: ${{ always() && steps.submit.outputs.reused == 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: Utatane-notary-request
          path: dist/notary-request/request.json
          retention-days: 30
          if-no-files-found: error
      - name: Remove temporary authentication keychain
        if: always()
        run: |
          if [[ -n "${UTATANE_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$UTATANE_SIGNING_KEYCHAIN"
          fi
