name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "Docs/**"
      - "apps/Utatane/Resources/UtataneHelp.html"
      - "project.yml"
      - "Scripts/test-website.cjs"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dl-wmsci-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Test website
        working-directory: website
        run: bun run check && bun run build && bun run test

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Upload Utatane page
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          WEBSITE_DEPLOY_PATH: ${{ secrets.WEBSITE_DEPLOY_PATH }}
        shell: bash
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USERNAME"
          test -n "$DEPLOY_PASSWORD"
          test -n "$WEBSITE_DEPLOY_PATH"
          [[ "$WEBSITE_DEPLOY_PATH" == /* ]]
          [[ "$WEBSITE_DEPLOY_PATH" != "/" ]]
          DEPLOY_TARGET="${WEBSITE_DEPLOY_PATH%/}"
          # The mirror intentionally has no --delete, so unrelated remote files remain.
          lftp -u "$DEPLOY_USERNAME","$DEPLOY_PASSWORD" "ftp://$DEPLOY_HOST" <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 3
          set net:timeout 20
          mirror --reverse --verbose --parallel=4 --exclude-glob .DS_Store --exclude-glob '*/.DS_Store' website/dist "$DEPLOY_TARGET"
          bye
          LFTP
