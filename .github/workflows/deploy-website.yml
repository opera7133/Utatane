name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/utatane.html"
      - "website/utatane-modern.html"
      - "website/utatane-modern.css"
      - "website/utatane-modern.js"
      - "website/en/utatane-modern.html"
      - "website/zh-hans/utatane-modern.html"
      - "website/zh-hant/utatane-modern.html"
      - "website/ko/utatane-modern.html"
      - "website/robots.txt"
      - "website/sitemap.xml"
      - "website/assets/utatane-icon.png"
      - "website/assets/utatane-icon.webp"
      - "website/assets/utatane-screenshot.png"
      - "website/assets/utatane-screenshot.webp"
      - "Scripts/test-website.cjs"
      - "Scripts/generate-website-locales.cjs"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dl-wmsci-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test website
        run: node Scripts/generate-website-locales.cjs --check && node Scripts/test-website.cjs

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Upload Utatane page
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          WEBSITE_DEPLOY_PATH: ${{ secrets.WEBSITE_DEPLOY_PATH }}
        shell: bash
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USERNAME"
          test -n "$DEPLOY_PASSWORD"
          test -n "$WEBSITE_DEPLOY_PATH"
          [[ "$WEBSITE_DEPLOY_PATH" == /* ]]
          lftp -u "$DEPLOY_USERNAME","$DEPLOY_PASSWORD" "ftp://$DEPLOY_HOST" <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 3
          set net:timeout 20
          mkdir -p "$WEBSITE_DEPLOY_PATH/en"
          mkdir -p "$WEBSITE_DEPLOY_PATH/zh-hans"
          mkdir -p "$WEBSITE_DEPLOY_PATH/zh-hant"
          mkdir -p "$WEBSITE_DEPLOY_PATH/ko"
          put -O "$WEBSITE_DEPLOY_PATH" website/utatane.html
          put -O "$WEBSITE_DEPLOY_PATH" website/utatane-modern.html
          put -O "$WEBSITE_DEPLOY_PATH" website/utatane-modern.css
          put -O "$WEBSITE_DEPLOY_PATH" website/utatane-modern.js
          put -O "$WEBSITE_DEPLOY_PATH/en" website/en/utatane-modern.html
          put -O "$WEBSITE_DEPLOY_PATH/zh-hans" website/zh-hans/utatane-modern.html
          put -O "$WEBSITE_DEPLOY_PATH/zh-hant" website/zh-hant/utatane-modern.html
          put -O "$WEBSITE_DEPLOY_PATH/ko" website/ko/utatane-modern.html
          put -O "$WEBSITE_DEPLOY_PATH" website/robots.txt
          put -O "$WEBSITE_DEPLOY_PATH" website/sitemap.xml
          put -O "$WEBSITE_DEPLOY_PATH/assets" website/assets/utatane-icon.png
          put -O "$WEBSITE_DEPLOY_PATH/assets" website/assets/utatane-icon.webp
          put -O "$WEBSITE_DEPLOY_PATH/assets" website/assets/utatane-screenshot.png
          put -O "$WEBSITE_DEPLOY_PATH/assets" website/assets/utatane-screenshot.webp
          bye
          LFTP
