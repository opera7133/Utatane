min_version = "2026.2.3"

[tools]
xcodegen = "2.46.0"
swiftformat = "0.62.1"

[tasks.generate]
description = "Generate Utatane.xcodeproj"
run = "xcodegen generate"

[tasks.build]
description = "Build the macOS app"
depends = ["generate"]
run = "xcodebuild -project Utatane.xcodeproj -scheme Utatane -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build"

[tasks.test]
description = "Run package tests"
run = "swift test --package-path packages"

[tasks.format]
description = "Format Swift sources"
run = "swiftformat apps packages"

[tasks.lint]
description = "Check Swift formatting"
run = "swiftformat apps packages --lint"

[tasks.localization-generate]
description = "Generate the string catalog from per-language translations"
run = "python3 Scripts/generate-localizations.py"

[tasks.localization-check]
description = "Check that the generated string catalog is up to date"
run = "python3 Scripts/generate-localizations.py --check"

[tasks.check]
description = "Run all local checks"
depends = ["localization-check", "lint", "test", "build"]

[tasks.build-hosts]
description = "Build the Windows DLL helper binary with zig"
run = """
mkdir -p apps/Utatane/Resources/WindowsDLLHost
Scripts/build-windows-dll-host.sh apps/Utatane/Resources/WindowsDLLHost/utatane-dll-host.exe
"""

[tasks.build-mcp]
description = "Build universal MCP server"
run = "swift build --package-path packages --configuration release --arch arm64 --arch x86_64 --product utatane-mcp"

[tasks.test-kagari]
description = "Verify kagari embedded in the universal Release app"
run = "python3 tools/native-shiori/test-bundle-kagari.py && sh tools/native-shiori/test-bundled-kagari.sh build/Build/Products/Release/Utatane.app arm64 x86_64"

[tasks.build-release]
description = "Build universal macOS app in Release configuration"
run = "xcodegen generate && xcodebuild -project Utatane.xcodeproj -scheme Utatane -configuration Release -destination 'generic/platform=macOS' -derivedDataPath build ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build && mkdir -p .generated-hosts && rm -f .generated-hosts/utatane-dll-host.exe && Scripts/build-windows-dll-host.sh .generated-hosts/utatane-dll-host.exe && cp .generated-hosts/utatane-dll-host.exe build/Build/Products/Release/Utatane.app/Contents/Resources/utatane-dll-host.exe"

[tasks.package]
description = "Package Release app into dist/Utatane-macOS.zip"
depends = ["build-release", "build-mcp"]
run = """
mkdir -p build/Build/Products/Release/Utatane.app/Contents/Helpers dist
cp packages/.build/apple/Products/Release/utatane-mcp build/Build/Products/Release/Utatane.app/Contents/Helpers/utatane-mcp
chmod 755 build/Build/Products/Release/Utatane.app/Contents/Helpers/utatane-mcp
codesign --force --sign - --identifier dev.utatane.mcp build/Build/Products/Release/Utatane.app/Contents/Helpers/utatane-mcp
codesign --force --deep --sign - --identifier dev.utatane.app build/Build/Products/Release/Utatane.app
codesign --verify --deep --strict build/Build/Products/Release/Utatane.app
ditto -c -k --keepParent build/Build/Products/Release/Utatane.app dist/Utatane-macOS.zip
"""

[tasks.release]
description = "Build and package universal release archive"
depends = ["package"]
