name: Utatane
options:
  bundleIdPrefix: dev.utatane
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  UtataneKit:
    path: packages

targets:
  Utatane:
    type: application
    platform: macOS
    sources:
      - path: apps/Utatane/Sources
      - path: apps/Utatane/Resources
    info:
      path: apps/Utatane/Info.plist
      properties:
        CFBundleDisplayName: Utatane
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026 opera7133."
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: NAR Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - dev.utatane.nar
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: dev.utatane.nar
            UTTypeDescription: NAR Archive
            UTTypeConformsTo:
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - nar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.utatane.app
        PRODUCT_NAME: Utatane
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: UtataneKit
        product: UtataneCore
      - package: UtataneKit
        product: UtataneContent
      - package: UtataneKit
        product: UtataneNetwork
      - package: UtataneKit
        product: UtataneBalloon
      - package: UtataneKit
        product: UtataneGhostKit
      - package: UtataneKit
        product: UtataneShell
      - package: UtataneKit
        product: UtataneRuntime
      - package: UtataneKit
        product: UtataneSakuraScript
      - package: UtataneKit
        product: UtatanePlatformMacOS
      - package: UtataneKit
        product: UtatanePOSIXShiori
      - package: UtataneKit
        product: UtataneKawariNative
      - package: UtataneKit
        product: UtataneYayaNative
      - package: UtataneKit
        product: UtataneSatoriNative
      - package: UtataneKit
        product: UtataneWindowsShiori
    scheme:
      gatherCoverageData: true
