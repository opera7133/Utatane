name: Utatane
options:
  bundleIdPrefix: dev.utatane
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
  UtataneKit:
    path: packages

targets:
  Utatane:
    type: application
    platform: macOS
    preBuildScripts:
      - name: Build and embed kagari
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          python3 "$SRCROOT/tools/native-shiori/bundle-kagari.py" \
            --output "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/NativeShiori/kagari" \
            --archs $ARCHS
    sources:
      - path: apps/Utatane/Sources
      - path: apps/Utatane/Resources
      - path: Content/Bundled
        type: folder
        buildPhase: resources
    info:
      path: apps/Utatane/Info.plist
      properties:
        CFBundleDisplayName: Utatane
        CFBundleIconFile: AppIcon.icns
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026 opera7133."
        NSLocationUsageDescription: "ゴーストが現在地に応じた天気を案内するために使用します。位置情報は天気の取得時だけ利用します。"
        NSLocationWhenInUseUsageDescription: "ゴーストが現在地に応じた天気を案内するために使用します。位置情報は天気の取得時だけ利用します。"
        NSMicrophoneUsageDescription: "音声認識やゴーストとのリアルタイム音声会話に使用します。音声は選択したRealtime APIへ送信されます。"
        NSPrincipalClass: NSApplication
        # Legacy ghosts declare arbitrary HTTP update sites. TLS certificate
        # validation remains enabled; keep application update hosts under ATS.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSExceptionDomains:
            dl.wmsci.com:
              NSIncludesSubdomains: true
            github.com:
              NSIncludesSubdomains: true
            githubusercontent.com:
              NSIncludesSubdomains: true
        SUFeedURL: https://dl.wmsci.com/utatane/appcast.xml
        SUEnableAutomaticChecks: true
        SUPublicEDKey: 4UTGPWrkBkZciJi6EbisveUBxtuuV2XKspMwtptZ2QA=
        SUScheduledCheckInterval: 86400
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: NAR Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes:
              - dev.utatane.nar
        CFBundleURLTypes:
          - CFBundleURLName: Ukagaka Web Link
            CFBundleURLSchemes:
              - x-ukagaka-link
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: dev.utatane.nar
            UTTypeDescription: NAR Archive
            UTTypeConformsTo:
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - nar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.utatane.app
        PRODUCT_NAME: Utatane
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.6
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: Sparkle
        product: Sparkle
      - package: UtataneKit
        product: UtataneCore
      - package: UtataneKit
        product: UtataneAI
      - package: UtataneKit
        product: UtataneRealtime
      - package: UtataneKit
        product: UtataneContent
      - package: UtataneKit
        product: UtataneNetwork
      - package: UtataneKit
        product: UtataneBalloon
      - package: UtataneKit
        product: UtataneGhostKit
      - package: UtataneKit
        product: UtataneShell
      - package: UtataneKit
        product: UtataneRuntime
      - package: UtataneKit
        product: UtataneSakuraScript
      - package: UtataneKit
        product: UtatanePlatformMacOS
      - package: UtataneKit
        product: UtatanePOSIXShiori
      - package: UtataneKit
        product: UtatanePlugin
      - package: UtataneKit
        product: UtataneKawariNative
      - package: UtataneKit
        product: UtataneMakoto
      - package: UtataneKit
        product: UtataneYayaNative
      - package: UtataneKit
        product: UtataneSatoriNative
      - package: UtataneKit
        product: UtataneFirstNative
      - package: UtataneKit
        product: UtataneMisakaNative
      - package: UtataneKit
        product: UtataneAkariNative
      - package: UtataneKit
        product: UtataneNativeSaori
      - package: UtataneKit
        product: UtataneWindowsShiori
    scheme:
      gatherCoverageData: true
